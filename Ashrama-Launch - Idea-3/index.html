<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ಶ್ರೀ ಆರೂಢ ತಪೋಭೂಮಿ</title>

<style>

body{
margin:0;
font-family:"Noto Serif Kannada", serif;
overflow:hidden;
background:black;
color:white;
}

/* Video background */

video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-1;
}

/* Center container */

.centerContent{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
width:80%;
max-width:850px;
}

/* Logo */

.logo{
width:90px;
margin-bottom:15px;
opacity:0;
transition:opacity 2s;
}

/* Text box */

.overlay{

background:rgba(0,0,0,0.45);
padding:40px;
border-radius:20px;

opacity:0;
transition:opacity 2s;

}

/* Om text */

.omtext{
color:#ffd27f;
font-size:24px;
margin-bottom:10px;
}

/* Title */

h1{
font-size:44px;
margin:10px 0;
}

h3{
font-weight:normal;
line-height:1.6;
}

/* Button */

.launch{

margin-top:25px;
padding:18px 50px;

border-radius:50px;
border:none;

background:linear-gradient(90deg,#ff8c00,#ffd27f);

font-size:18px;
cursor:pointer;
font-weight:bold;

transition:.3s;

}

.launch:hover{
transform:scale(1.05);
}

/* Show animation */

.show{
opacity:1;
}

</style>

</head>

<body>

<!-- Video -->

<video autoplay muted playsinline id="introVideo">
<source src="opening-video.mp4" type="video/mp4">
</video>

<!-- Music -->

<audio id="bgmusic" loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<!-- Center Content -->

<div class="centerContent">

<img src="swamiji-logo.png" class="logo" id="logo">

<div class="overlay" id="textOverlay">

<div class="omtext">
ಓಂ ನಮಃ ಶಿವಾಯ | Om Namah Shivaya
</div>

<h1>
ಶ್ರೀ ಆರೂಢ ತಪೋಭೂಮಿ
</h1>

<h3>
ಜಗದ್ಗುರು ಶ್ರೀ ಸಿದ್ಧಾರೂಢ ಸ್ವಾಮಿ ಮಹಾಸಂಸ್ಥಾನ<br>
ಸುಕ್ಷೇತ್ರ ಖಂಡೇರಾಯನಹಳ್ಳಿ
</h3>

<button class="launch" onclick="launchWebsite()">
Click here to view the website<br>
ವೆಬ್‌ಸೈಟ್ ನೋಡಲು ಇಲ್ಲಿ ಕ್ಲಿಕ್ ಮಾಡಿ
</button>

</div>

</div>

<script>

/* Show logo and text when video reaches border */

setTimeout(()=>{

document.getElementById("textOverlay").classList.add("show");
document.getElementById("logo").classList.add("show");

/* Start music */

document.getElementById("bgmusic").play();

},4500);


/* Button click */

function launchWebsite(){

document.getElementById("bgmusic").pause();

window.location.href="https://sriaaroodhatapobhomi.com";

}

</script>

</body>
</html>
